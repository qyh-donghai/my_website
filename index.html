<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard</title>
  <style>
    /* ========== Reset & Base ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 20px;
    }
    a { color: #64b5f6; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ========== Layout ========== */
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #2a2a3e;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .greeting {
      font-size: 16px;
      color: #888;
    }
    .header .greeting strong { color: #e0e0e0; }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* ========== Cards ========== */
    .card {
      background: #1a1a2e;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #2a2a3e;
      transition: box-shadow 0.2s;
    }
    .card:hover {
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.1);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #667eea;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .badge {
      font-size: 11px;
      background: #2a2a3e;
      color: #888;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 400;
    }

    /* ========== Weather Card (Full Width) ========== */
    .weather-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      position: relative;
      overflow: hidden;
    }
    .weather-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(102,126,234,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .weather-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .weather-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .weather-temp {
      font-size: 42px;
      font-weight: 700;
    }
    .weather-desc {
      font-size: 16px;
      color: #aaa;
    }
    .weather-city {
      font-size: 14px;
      color: #667eea;
    }
    .weather-details {
      display: flex;
      gap: 20px;
      color: #888;
      font-size: 14px;
    }
    .weather-details span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ========== Calendar ========== */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .calendar-header h3 {
      font-size: 18px;
      font-weight: 600;
    }
    .calendar-nav {
      display: flex;
      gap: 8px;
    }
    .calendar-nav button {
      background: #2a2a3e;
      border: none;
      color: #e0e0e0;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }
    .calendar-nav button:hover { background: #3a3a5e; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
    }
    .calendar-grid .day-name {
      font-size: 12px;
      color: #666;
      padding: 6px 0;
      font-weight: 500;
    }
    .calendar-grid .day {
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      position: relative;
      min-height: 44px;
    }
    .calendar-grid .day:hover {
      background: #2a2a3e;
    }
    .calendar-grid .day.today {
      background: #667eea;
      color: #fff;
      font-weight: 600;
    }
    .calendar-grid .day.other-month {
      color: #444;
    }
    .calendar-grid .day .dot {
      display: block;
      width: 5px;
      height: 5px;
      background: #667eea;
      border-radius: 50%;
      margin: 3px auto 0;
    }
    .calendar-grid .day .task-count {
      font-size: 9px;
      color: #888;
    }

    /* Selected day tasks */
    .day-tasks {
      margin-top: 16px;
      border-top: 1px solid #2a2a3e;
      padding-top: 12px;
    }
    .day-tasks h4 {
      font-size: 14px;
      color: #888;
      margin-bottom: 8px;
    }
    .day-tasks .task-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      font-size: 14px;
    }
    .day-tasks .task-item input[type="checkbox"] {
      accent-color: #667eea;
    }
    .day-tasks .task-item label {
      flex: 1;
      cursor: pointer;
    }
    .day-tasks .task-item label.done {
      text-decoration: line-through;
      color: #666;
    }
    .day-tasks .task-item .delete-task {
      color: #f44336;
      cursor: pointer;
      opacity: 0.5;
      font-size: 14px;
    }
    .day-tasks .task-item .delete-task:hover { opacity: 1; }
    .add-task-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .add-task-form input {
      flex: 1;
      background: #2a2a3e;
      border: 1px solid #3a3a5e;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .add-task-form input:focus { border-color: #667eea; }
    .add-task-form button {
      background: #667eea;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }
    .add-task-form button:hover { background: #5a6fd6; }

    /* ========== Sections ========== */
    .learning-section {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
    }

    .list-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a3e;
      font-size: 14px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .emoji { font-size: 18px; }
    .list-item .item-title {
      flex: 1;
      font-weight: 500;
    }
    .list-item .item-meta {
      font-size: 12px;
      color: #888;
    }
    .add-item-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .add-item-form input {
      flex: 1;
      background: #2a2a3e;
      border: 1px solid #3a3a5e;
      color: #e0e0e0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    .add-item-form input:focus { border-color: #667eea; }
    .add-item-form button {
      background: #667eea;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .add-item-form button:hover { background: #5a6fd6; }
    .delete-item {
      color: #f44336;
      cursor: pointer;
      opacity: 0.4;
      font-size: 14px;
    }
    .delete-item:hover { opacity: 1; }

    /* ========== Footer ========== */
    .footer {
      grid-column: 1 / -1;
      text-align: center;
      padding: 20px;
      color: #444;
      font-size: 12px;
    }
    .footer a { color: #667eea; }

    /* ========== Responsive ========== */
    @media (max-width: 900px) {
      .dashboard-grid { grid-template-columns: 1fr; }
      .learning-section { grid-template-columns: 1fr; }
      .weather-details { display: none; }
    }

    /* ========== Scrollbar ========== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3a5e; border-radius: 3px; }
  </style>
</head>
<body>
<div class="container">

  <!-- ===== Header ===== -->
  <div class="header">
    <div>
      <h1>✦ My Dashboard</h1>
      <div class="greeting">你好，<strong id="greeting-name">朋友</strong> · <span id="current-date"></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <button onclick="resetAllData()" style="background:#2a2a3e;color:#888;border:1px solid #3a3a5e;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:12px;">🔄 重置数据</button>
    </div>
  </div>

  <div class="dashboard-grid">

    <!-- ===== Weather ===== -->
    <div class="card weather-card">
      <div class="weather-content">
        <div class="weather-left">
          <div id="weather-icon" style="font-size:48px;">☀️</div>
          <div>
            <div class="weather-temp" id="weather-temp">--°C</div>
            <div class="weather-desc" id="weather-desc">加载中...</div>
            <div class="weather-city" id="weather-city">📍 获取位置中</div>
          </div>
        </div>
        <div class="weather-details">
          <span>💧 <span id="weather-humidity">--</span></span>
          <span>🌬️ <span id="weather-wind">--</span></span>
          <span>🔆 <span id="weather-uv">--</span></span>
        </div>
      </div>
    </div>

    <!-- ===== Calendar ===== -->
    <div class="card" style="grid-column:1/2;">
      <div class="card-title">📅 日历</div>
      <div class="calendar-header">
        <h3 id="calendar-title"></h3>
        <div class="calendar-nav">
          <button onclick="changeMonth(-1)">◀</button>
          <button onclick="changeMonth(1)">▶</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>

      <div class="day-tasks" id="day-tasks">
        <h4 id="selected-day-label">📌 点击日期添加任务</h4>
        <div id="tasks-list"></div>
        <div class="add-task-form">
          <input type="text" id="task-input" placeholder="添加任务..." maxlength="100">
          <button onclick="addTask()">添加</button>
        </div>
      </div>
    </div>

    <!-- ===== Card 1: 正在学 ===== -->
    <div class="card" style="grid-column:2/3;grid-row:2/3;">
      <div class="card-title">📖 正在学</div>
      <div id="learning-list"></div>
      <div class="add-item-form">
        <input type="text" id="learning-input" placeholder="添加学习项目..." maxlength="80">
        <button onclick="addLearning()">添加</button>
      </div>
    </div>

    <!-- ===== Card 2: 学习任务 & Card 3: 休闲娱乐 (下面一行) ===== -->
    <div class="learning-section">

      <div class="card">
        <div class="card-title">📚 学习任务</div>
        <div id="study-list"></div>
        <div class="add-item-form">
          <input type="text" id="study-input" placeholder="添加学习任务..." maxlength="80">
          <button onclick="addStudy()">添加</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🎮 休闲娱乐</div>
        <div id="leisure-list"></div>
        <div class="add-item-form">
          <input type="text" id="leisure-input" placeholder="添加休闲活动..." maxlength="80">
          <button onclick="addLeisure()">添加</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🎯 今日目标</div>
        <div id="goal-list"></div>
        <div class="add-item-form">
          <input type="text" id="goal-input" placeholder="添加今日目标..." maxlength="80">
          <button onclick="addGoal()">添加</button>
        </div>
      </div>

    </div>

    <div class="footer">
      参考灵感来源于 <a href="https://github.com">GitHub</a> 社区 · 数据存储在浏览器本地 · 
      <a href="https://github.com/qyh-donghai/my_website">查看源码</a>
    </div>

  </div>
</div>

<script>
// ============================================================
//  DATA LAYER (localStorage)
// ============================================================
const STORAGE_KEY = 'my_dashboard_data';

function getData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : getDefaultData();
  } catch { return getDefaultData(); }
}

function getDefaultData() {
  return {
    tasks: {},            // { '2026-05-19': [{id, text, done}, ...] }
    learning: [],         // [{id, text}]
    study: [],
    leisure: [],
    goals: [],
    city: '',
  };
}

function saveData(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function resetAllData() {
  if (!confirm('确定要重置所有数据吗？此操作不可恢复！')) return;
  saveData(getDefaultData());
  renderAll();
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ============================================================
//  WEATHER (wttr.in - free, no API key)
// ============================================================
async function fetchWeather() {
  try {
    // Get city from data or detect via IP
    let data = getData();
    const city = data.city || '';
    const url = city
      ? `https://wttr.in/${encodeURIComponent(city)}?format=j1`
      : 'https://wttr.in/?format=j1';

    const resp = await fetch(url, { cache: 'no-cache' });
    if (!resp.ok) throw new Error('Weather fetch failed');
    const json = await resp.json();
    const cur = json.current_condition[0];
    const loc = json.nearest_area?.[0]?.areaName?.[0]?.value || '未知';

    document.getElementById('weather-icon').textContent = getWeatherEmoji(cur.weatherCode);
    document.getElementById('weather-temp').textContent = `${cur.temp_C}°C`;
    document.getElementById('weather-desc').textContent = cur.weatherDesc[0].value;
    document.getElementById('weather-city').textContent = `📍 ${loc}`;
    document.getElementById('weather-humidity').textContent = `${cur.humidity}%`;
    document.getElementById('weather-wind').textContent = `${cur.windspeedKmph} km/h`;
    document.getElementById('weather-uv').textContent = `${cur.uvIndex}`;

    // Save city for next time
    if (!data.city) {
      data.city = loc;
      saveData(data);
    }
  } catch (e) {
    document.getElementById('weather-temp').textContent = '--°C';
    document.getElementById('weather-desc').textContent = '天气服务暂不可用';
    document.getElementById('weather-city').textContent = '📍 新加坡';
  }
}

function getWeatherEmoji(code) {
  const map = {
    113:'☀️',116:'🌤️',119:'☁️',122:'☁️',143:'🌫️',
    176:'🌦️',179:'🌧️',182:'🌧️',185:'🌧️',200:'⛈️',
    227:'🌨️',230:'🌨️',248:'🌫️',260:'🌫️',
    263:'🌦️',266:'🌦️',281:'🌧️',284:'🌧️',
    293:'🌦️',296:'🌦️',299:'🌧️',302:'🌧️',
    305:'🌧️',308:'🌧️',311:'🌧️',314:'🌧️',
    317:'🌧️',320:'🌨️',323:'🌨️',326:'🌨️',
    329:'🌨️',332:'🌨️',335:'🌨️',338:'🌨️',
    350:'🧊',353:'🌦️',356:'🌧️',359:'🌧️',
    362:'🌧️',365:'🌧️',368:'🌨️',371:'🌨️',
    374:'🧊',377:'🧊',386:'⛈️',389:'⛈️',
    392:'⛈️',395:'⛈️',
  };
  return map[code] || '🌤️';
}

// ============================================================
//  CALENDAR
// ============================================================
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDate = formatDate(new Date());
const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const dayNames = ['日','一','二','三','四','五','六'];

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function renderCalendar() {
  const title = document.getElementById('calendar-title');
  title.textContent = `${currentYear}年 ${monthNames[currentMonth]}`;

  const grid = document.getElementById('calendar-grid');
  grid.innerHTML = '';

  // Day names
  dayNames.forEach(n => {
    const el = document.createElement('div');
    el.className = 'day-name';
    el.textContent = n;
    grid.appendChild(el);
  });

  // First day of month
  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();
  const today = formatDate(new Date());
  const data = getData();

  // Previous month's trailing days
  for (let i = firstDay - 1; i >= 0; i--) {
    const el = document.createElement('div');
    el.className = 'day other-month';
    el.textContent = daysInPrev - i;
    grid.appendChild(el);
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el = document.createElement('div');
    el.className = 'day';
    if (dateStr === today) el.classList.add('today');
    if (dateStr === selectedDate) el.style.outline = '2px solid #764ba2';
    el.textContent = d;

    // Show dots for days with tasks
    const dayTasks = data.tasks[dateStr];
    if (dayTasks && dayTasks.length > 0) {
      const dot = document.createElement('span');
      dot.className = 'dot';
      el.appendChild(document.createElement('br'));
      el.appendChild(dot);
    }

    el.addEventListener('click', () => {
      selectedDate = dateStr;
      renderCalendar();
      renderDayTasks();
    });

    grid.appendChild(el);
  }

  // Fill remaining cells
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    const el = document.createElement('div');
    el.className = 'day other-month';
    el.textContent = i;
    grid.appendChild(el);
  }

  renderDayTasks();
}

function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}

// ============================================================
//  DAY TASKS
// ============================================================
function renderDayTasks() {
  const data = getData();
  const tasks = data.tasks[selectedDate] || [];
  const label = document.getElementById('selected-day-label');
  const list = document.getElementById('tasks-list');

  const d = new Date(selectedDate);
  const dayName = ['日','一','二','三','四','五','六'][d.getDay()];
  label.textContent = `📌 ${selectedDate} (周${dayName}) · ${tasks.length} 个任务`;

  if (tasks.length === 0) {
    list.innerHTML = '<div style="color:#666;font-size:13px;padding:8px 0;">还没有任务，添加一个吧 ✨</div>';
    return;
  }

  list.innerHTML = tasks.map((t, i) => `
    <div class="task-item">
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${i})">
      <label class="${t.done ? 'done' : ''}" onclick="toggleTask(${i})">${escapeHtml(t.text)}</label>
      <span class="delete-task" onclick="deleteTask(${i})">✕</span>
    </div>
  `).join('');
}

function addTask() {
  const input = document.getElementById('task-input');
  const text = input.value.trim();
  if (!text) return;

  const data = getData();
  if (!data.tasks[selectedDate]) data.tasks[selectedDate] = [];
  data.tasks[selectedDate].push({ id: uid(), text, done: false });
  saveData(data);
  input.value = '';
  renderCalendar();
}

function toggleTask(index) {
  const data = getData();
  const tasks = data.tasks[selectedDate];
  if (tasks && tasks[index]) {
    tasks[index].done = !tasks[index].done;
    saveData(data);
    renderDayTasks();
    renderCalendar();
  }
}

function deleteTask(index) {
  const data = getData();
  const tasks = data.tasks[selectedDate];
  if (tasks && tasks[index]) {
    tasks.splice(index, 1);
    if (tasks.length === 0) delete data.tasks[selectedDate];
    saveData(data);
    renderCalendar();
  }
}

// ============================================================
//  GENERIC LISTS (learning, study, leisure, goals)
// ============================================================
function renderLearning() {
  const data = getData();
  const list = document.getElementById('learning-list');
  if (data.learning.length === 0) {
    list.innerHTML = '<div style="color:#666;font-size:13px;padding:8px 0;">添加你想学的内容吧 🚀</div>';
    return;
  }
  list.innerHTML = data.learning.map((item, i) => `
    <div class="list-item">
      <span class="emoji">📖</span>
      <span class="item-title">${escapeHtml(item.text)}</span>
      <span class="delete-item" onclick="deleteLearning(${i})">✕</span>
    </div>
  `).join('');
}

function addLearning() {
  const input = document.getElementById('learning-input');
  const text = input.value.trim();
  if (!text) return;
  const data = getData();
  data.learning.push({ id: uid(), text });
  saveData(data);
  input.value = '';
  renderLearning();
}

function deleteLearning(index) {
  const data = getData();
  data.learning.splice(index, 1);
  saveData(data);
  renderLearning();
}

function renderStudy() {
  const data = getData();
  const list = document.getElementById('study-list');
  if (data.study.length === 0) {
    list.innerHTML = '<div style="color:#666;font-size:13px;padding:8px 0;">暂无学习任务 📚</div>';
    return;
  }
  list.innerHTML = data.study.map((item, i) => `
    <div class="list-item">
      <span class="emoji">📝</span>
      <span class="item-title">${escapeHtml(item.text)}</span>
      <span class="delete-item" onclick="deleteStudy(${i})">✕</span>
    </div>
  `).join('');
}

function addStudy() {
  const input = document.getElementById('study-input');
  const text = input.value.trim();
  if (!text) return;
  const data = getData();
  data.study.push({ id: uid(), text });
  saveData(data);
  input.value = '';
  renderStudy();
}

function deleteStudy(index) {
  const data = getData();
  data.study.splice(index, 1);
  saveData(data);
  renderStudy();
}

// ============================================================
//  HELPERS
// ============================================================
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderAll() {
  renderCalendar();
  renderLearning();
  renderStudy();
  renderLeisure();

// ============================================================
//  INIT
// ============================================================
function updateDate() {
  const now = new Date();
  const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('current-date').textContent = now.toLocaleDateString('zh-CN', opts);
}

// Set greeting based on time
const hour = new Date().getHours();
let greeting = '早上好';
if (hour >= 12 && hour < 18) greeting = '下午好';
else if (hour >= 18) greeting = '晚上好';
document.getElementById('greeting-name').textContent = `${greeting}！`;

updateDate();
renderAll();
fetchWeather();
// Refresh weather every 30 min
setInterval(fetchWeather, 30 * 60 * 1000);

// Enter key to submit
document.querySelectorAll('.add-task-form input, .add-item-form input').forEach(inp => {
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const btn = inp.parentElement.querySelector('button');
      if (btn) btn.click();
    }
  });
});
